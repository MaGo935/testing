<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>CS Web 1.6</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background: #000;
        font-family: monospace;
        color: #fff;
      }
      #hud {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      #cross {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 6px;
        height: 6px;
        margin: -4px;
        border: 1px solid #0f0;
        border-radius: 50%;
      }
      #st {
        position: absolute;
        left: 14px;
        bottom: 12px;
        font-size: 26px;
        color: #ff0;
        text-shadow: 1px 1px #000;
      }
      #sb {
        position: absolute;
        right: 12px;
        top: 12px;
        font-size: 13px;
        background: #0008;
        padding: 6px;
        white-space: pre;
      }
      #kf {
        position: absolute;
        left: 12px;
        top: 12px;
        font-size: 14px;
        text-shadow: 1px 1px #000;
      }
      #menu {
        position: fixed;
        inset: 0;
        background: #000d;
        display: flex;
        flex-direction: column;
        gap: 8px;
        align-items: center;
        justify-content: center;
      }
      input,
      select,
      button {
        font: 16px monospace;
        padding: 6px;
        width: 300px;
      }
    </style>
  </head>
  <body>
    <div id="hud">
      <div id="cross"></div>
      <div id="st"></div>
      <div id="sb"></div>
      <div id="kf"></div>
      <div
        id="code"
        style="
          position: absolute;
          top: 8px;
          left: 50%;
          transform: translateX(-50%);
          font-size: 14px;
          text-shadow: 1px 1px #000;
        "
      ></div>
    </div>
    <div id="menu">
      <h1>CS WEB 1.6</h1>
      <input id="nm" placeholder="Seu nome" maxlength="12" />
      <select id="tm">
        <option value="CT">Counter-Terrorist</option>
        <option value="T">Terrorist</option>
      </select>
      <button id="host">CRIAR PARTIDA (você é o host)</button>
      <input id="cd" placeholder="Código da partida" maxlength="4" />
      <button id="join">ENTRAR NA PARTIDA</button>
      <details>
        <summary>Servidor dedicado (opcional)</summary>
        <input id="srv" placeholder="wss://..." /><button id="ded">
          CONECTAR
        </button>
      </details>
      <small
        >WASD mover · Espaço pular · Mouse mirar/atirar · R recarregar</small
      >
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <script>
      const $ = (i) => document.getElementById(i),
        T = THREE,
        K = {};
      const MAP = [
        [0, 2, -40, 80, 4, 1],
        [0, 2, 40, 80, 4, 1],
        [-40, 2, 0, 1, 4, 80],
        [40, 2, 0, 1, 4, 80],
        [0, 1.5, 0, 10, 3, 2],
        [-15, 1.5, -10, 2, 3, 14],
        [15, 1.5, 10, 2, 3, 14],
        [-10, 1, 15, 6, 2, 6],
        [10, 1, -15, 6, 2, 6],
        [0, 1.5, -25, 16, 3, 2],
        [0, 1.5, 25, 16, 3, 2],
        [-28, 1.5, 20, 8, 3, 8],
        [28, 1.5, -20, 8, 3, 8],
      ];
      const B = MAP.map(([x, y, z, w, h, d]) => ({ x, y, z, w, h, d }));
      const bx = (px, py, pz) =>
        B.find(
          (b) =>
            Math.abs(px - b.x) < b.w / 2 + 0.4 &&
            Math.abs(pz - b.z) < b.d / 2 + 0.4 &&
            py < b.y + b.h / 2 - 0.01 &&
            py + 1.8 > b.y - b.h / 2,
        );
      const scene = new T.Scene();
      scene.background = new T.Color(0x9ec8e8);
      scene.fog = new T.Fog(0x9ec8e8, 30, 90);
      const cam = new T.PerspectiveCamera(
        75,
        innerWidth / innerHeight,
        0.1,
        200,
      );
      scene.add(cam);
      const ren = new T.WebGLRenderer({ antialias: true });
      ren.setSize(innerWidth, innerHeight);
      document.body.prepend(ren.domElement);
      scene.add(new T.HemisphereLight(0xffffff, 0x665544, 1));
      const sun = new T.DirectionalLight(0xffffff, 0.6);
      sun.position.set(20, 40, 10);
      scene.add(sun);
      const fl = new T.Mesh(
        new T.PlaneGeometry(80, 80),
        new T.MeshLambertMaterial({ color: 0xc2b280 }),
      );
      fl.rotation.x = -Math.PI / 2;
      scene.add(fl);
      const wm = B.map((b, i) => {
        const m = new T.Mesh(
          new T.BoxGeometry(b.w, b.h, b.d),
          new T.MeshLambertMaterial({ color: i % 2 ? 0x9a8a6a : 0x7a6a50 }),
        );
        m.position.set(b.x, b.y, b.z);
        scene.add(m);
        return m;
      });
      const gun = new T.Mesh(
        new T.BoxGeometry(0.1, 0.12, 0.55),
        new T.MeshLambertMaterial({ color: 0x222222 }),
      );
      gun.position.set(0.25, -0.22, -0.5);
      cam.add(gun);
      function mk(id, team) {
        const g = new T.Group(),
          c = team === "T" ? 0xdd9933 : 0x4477ff;
        const b = new T.Mesh(
          new T.BoxGeometry(0.6, 1, 0.4),
          new T.MeshLambertMaterial({ color: c }),
        );
        b.position.y = 0.8;
        const h = new T.Mesh(
          new T.BoxGeometry(0.3, 0.3, 0.3),
          new T.MeshLambertMaterial({ color: 0xf0c8a0 }),
        );
        h.position.y = 1.5;
        b.userData = { pid: id };
        h.userData = { pid: id, head: true };
        g.add(b, h);
        return g;
      }
      const me = {
          x: 0,
          y: 0,
          z: 0,
          vy: 0,
          yaw: 0,
          pitch: 0,
          hp: 100,
          alive: false,
          id: null,
          team: "CT",
          ammo: 30,
          rel: false,
        },
        others = {};
      let ac,
        down = false,
        lastShot = 0,
        sent = 0,
        prev = 0;
      function beep() {
        ac = ac || new AudioContext();
        const o = ac.createOscillator(),
          g = ac.createGain(),
          t = ac.currentTime;
        o.type = "sawtooth";
        o.frequency.setValueAtTime(220, t);
        o.frequency.exponentialRampToValueAtTime(40, t + 0.1);
        g.gain.setValueAtTime(0.2, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
        o.connect(g).connect(ac.destination);
        o.start();
        o.stop(t + 0.1);
      }
      function reload() {
        if (me.rel || me.ammo === 30) return;
        me.rel = true;
        setTimeout(() => {
          me.ammo = 30;
          me.rel = false;
        }, 1800);
      }
      const rc = new T.Raycaster();
      rc.far = 100;
      function shoot(t) {
        if (!me.alive || me.rel || t - lastShot < 110) return;
        if (me.ammo <= 0) return reload();
        lastShot = t;
        me.ammo--;
        beep();
        me.pitch += 0.006;
        rc.setFromCamera({ x: 0, y: 0 }, cam);
        const h = rc.intersectObjects([
          ...wm,
          ...Object.values(others)
            .filter((o) => o.g.visible)
            .flatMap((o) => o.g.children),
        ])[0];
        if (h && h.object.userData.pid)
          net.send({
            t: "hit",
            id: h.object.userData.pid,
            head: !!h.object.userData.head,
          });
        if (me.ammo === 0) reload();
      }
      function move(dt) {
        const f = (K.KeyW ? 1 : 0) - (K.KeyS ? 1 : 0),
          r = (K.KeyD ? 1 : 0) - (K.KeyA ? 1 : 0),
          s = (6 * dt) / (Math.hypot(f, r) || 1);
        const dx = (-Math.sin(me.yaw) * f + Math.cos(me.yaw) * r) * s,
          dz = (-Math.cos(me.yaw) * f - Math.sin(me.yaw) * r) * s;
        if (!bx(me.x + dx, me.y, me.z)) me.x += dx;
        if (!bx(me.x, me.y, me.z + dz)) me.z += dz;
        if (K.Space && me.ground) me.vy = 7;
        me.vy -= 20 * dt;
        const ny = me.y + me.vy * dt;
        me.ground = false;
        const b = bx(me.x, ny, me.z);
        if (b) {
          if (me.vy < 0) {
            me.y = b.y + b.h / 2;
            me.ground = true;
          }
          me.vy = 0;
        } else me.y = ny;
        if (me.y <= 0) {
          me.y = 0;
          me.vy = 0;
          me.ground = true;
        }
      }
      function loop(t) {
        requestAnimationFrame(loop);
        const dt = Math.min((t - prev) / 1000, 0.05);
        prev = t;
        if (me.alive && document.pointerLockElement) {
          move(dt);
          if (down) shoot(t);
        }
        cam.position.set(me.x, me.y + 1.6, me.z);
        cam.rotation.set(me.pitch, me.yaw, 0, "YXZ");
        for (const i in others) others[i].g.position.lerp(others[i].t, 0.3);
        if (net.on && me.alive && t - sent > 50) {
          sent = t;
          net.send({ t: "s", x: me.x, y: me.y, z: me.z, yaw: me.yaw });
        }
        $("st").textContent = me.alive
          ? `HP ${me.hp}   ${me.rel ? "RECARREGANDO" : me.ammo}/30`
          : "MORTO - renascendo...";
        ren.render(scene, cam);
      }
      function snap(ps) {
        const seen = {};
        ps.forEach((p) => {
          if (p.id === me.id) {
            me.hp = p.hp;
            me.alive = p.alive;
            return;
          }
          seen[p.id] = 1;
          let o = others[p.id];
          if (!o) {
            o = others[p.id] = {
              g: mk(p.id, p.team),
              t: new T.Vector3(p.x, p.y, p.z),
            };
            o.g.position.copy(o.t);
            scene.add(o.g);
          }
          o.t.set(p.x, p.y, p.z);
          o.g.rotation.y = p.yaw;
          o.g.visible = p.alive;
        });
        for (const i in others)
          if (!seen[i]) {
            scene.remove(others[i].g);
            delete others[i];
          }
        $("sb").textContent = ps
          .sort((a, b) => b.k - a.k)
          .map((p) => `[${p.team}] ${p.name} ${p.k}/${p.d}`)
          .join("\n");
      }
      function spawnMe(m) {
        Object.assign(me, {
          x: m.x,
          y: 0,
          z: m.z,
          vy: 0,
          hp: 100,
          alive: true,
          ammo: 30,
          rel: false,
          yaw: me.team === "T" ? Math.PI : 0,
          pitch: 0,
        });
      }
      const net = { on: false, send() {} };
      function onMsg(m) {
        if (m.t === "init") {
          me.id = m.id;
          spawnMe(m);
          $("menu").style.display = "none";
        } else if (m.t === "p") snap(m.ps);
        else if (m.t === "respawn") spawnMe(m);
        else if (m.t === "kill") {
          const d = document.createElement("div");
          d.textContent = `${m.k} ➜ ${m.v}${m.head ? " (HS)" : ""}`;
          $("kf").append(d);
          setTimeout(() => d.remove(), 4000);
        }
      }
      function leave(msg) {
        net.on = false;
        me.alive = false;
        for (const i in others) {
          scene.remove(others[i].g);
          delete others[i];
        }
        $("code").textContent = "";
        $("menu").style.display = "flex";
        if (msg) alert(msg);
      }
      const hello = () => ({
        t: "join",
        name: $("nm").value || "Player",
        team: me.team,
      });
      function prep() {
        me.team = $("tm").value;
        ren.domElement.requestPointerLock();
      }
      // ---- lógica de host (mesma do server.js, rodando no navegador) ----
      const H = {
        P: new Map(),
        tx: {},
        n: 1,
        sp: (t) => ({ x: Math.random() * 60 - 30, z: t === "T" ? -35 : 35 }),
        bc(o) {
          H.P.forEach((p) => p.tx(o));
        },
        drop(id) {
          H.P.delete(id);
          delete H.tx[id];
        },
        handle(id, m) {
          let p = H.P.get(id);
          if (m.t === "join" && !p) {
            const team = m.team === "T" ? "T" : "CT",
              s = H.sp(team);
            p = {
              id,
              tx: H.tx[id],
              name: String(m.name || "Player").slice(0, 12),
              team,
              ...s,
              y: 0,
              yaw: 0,
              hp: 100,
              alive: true,
              k: 0,
              d: 0,
              last: 0,
            };
            H.P.set(id, p);
            p.tx({ t: "init", id, ...s });
          } else if (!p) return;
          else if (m.t === "s" && p.alive) {
            if ([m.x, m.y, m.z, m.yaw].every(Number.isFinite))
              Object.assign(p, { x: m.x, y: m.y, z: m.z, yaw: m.yaw });
          } else if (m.t === "hit") {
            const v = H.P.get(m.id),
              now = Date.now();
            if (
              !v ||
              !p.alive ||
              !v.alive ||
              v.team === p.team ||
              now - p.last < 90
            )
              return;
            p.last = now;
            v.hp -= m.head ? 100 : 27;
            if (v.hp <= 0) {
              v.hp = 0;
              v.alive = false;
              v.d++;
              p.k++;
              H.bc({ t: "kill", k: p.name, v: v.name, head: !!m.head });
              setTimeout(() => {
                if (!H.P.has(v.id)) return;
                const s = H.sp(v.team);
                Object.assign(v, s, { hp: 100, alive: true, y: 0 });
                v.tx({ t: "respawn", ...s });
              }, 3000);
            }
          }
        },
      };
      let tick;
      $("host").onclick = () => {
        prep();
        const code = Array.from(
          { length: 4 },
          () => "ABCDEFGHJKMNPQRSTUVWXYZ23456789"[(Math.random() * 31) | 0],
        ).join("");
        const peer = new Peer("csweb-" + code);
        peer.on("error", (e) =>
          e.type === "unavailable-id"
            ? $("host").click()
            : leave("Erro P2P: " + e.type),
        );
        peer.on("open", () => {
          H.tx[0] = onMsg;
          net.send = (m) => H.handle(0, m);
          net.on = true;
          clearInterval(tick);
          tick = setInterval(
            () =>
              H.bc({
                t: "p",
                ps: [...H.P.values()].map(
                  ({ id, name, team, x, y, z, yaw, hp, alive, k, d }) => ({
                    id,
                    name,
                    team,
                    x,
                    y,
                    z,
                    yaw,
                    hp,
                    alive,
                    k,
                    d,
                  }),
                ),
              }),
            50,
          );
          $("code").textContent =
            `Código: ${code}  |  ${location.href.split("#")[0]}#${code}`;
          H.handle(0, hello());
        });
        peer.on("connection", (c) => {
          const id = H.n++;
          H.tx[id] = (m) => c.open && c.send(m);
          c.on("data", (m) => H.handle(id, m));
          c.on("close", () => H.drop(id));
        });
      };
      $("join").onclick = () => {
        prep();
        const code = $("cd").value.trim().toUpperCase(),
          peer = new Peer();
        peer.on("error", (e) =>
          leave(
            e.type === "peer-unavailable"
              ? "Partida não encontrada"
              : "Erro P2P: " + e.type,
          ),
        );
        peer.on("open", () => {
          const c = peer.connect("csweb-" + code, { serialization: "json" });
          c.on("open", () => {
            net.send = (m) => c.send(m);
            net.on = true;
            c.send(hello());
          });
          c.on("data", onMsg);
          c.on("close", () => leave("O host desconectou"));
        });
      };
      $("srv").value = localStorage.srv || "wss://";
      $("ded").onclick = () => {
        prep();
        localStorage.srv = $("srv").value;
        let ws;
        try {
          ws = new WebSocket($("srv").value);
        } catch (e) {
          return leave("URL inválida");
        }
        ws.onopen = () => {
          net.send = (m) => ws.send(JSON.stringify(m));
          net.on = true;
          net.send(hello());
        };
        ws.onerror = () => leave("Não foi possível conectar");
        ws.onclose = () => net.on && leave("Servidor desconectou");
        ws.onmessage = (e) => onMsg(JSON.parse(e.data));
      };
      if (location.hash) $("cd").value = location.hash.slice(1).toUpperCase();
      addEventListener("keydown", (e) => {
        K[e.code] = true;
        if (e.code === "KeyR") reload();
      });
      addEventListener("keyup", (e) => (K[e.code] = false));
      addEventListener("mousedown", () => {
        down = true;
        if ($("menu").style.display === "none" && !document.pointerLockElement)
          ren.domElement.requestPointerLock();
      });
      addEventListener("mouseup", () => (down = false));
      addEventListener("mousemove", (e) => {
        if (!document.pointerLockElement) return;
        me.yaw -= e.movementX * 0.002;
        me.pitch = Math.max(
          -1.5,
          Math.min(1.5, me.pitch - e.movementY * 0.002),
        );
      });
      addEventListener("resize", () => {
        cam.aspect = innerWidth / innerHeight;
        cam.updateProjectionMatrix();
        ren.setSize(innerWidth, innerHeight);
      });
      requestAnimationFrame(loop);
    </script>
  </body>
</html>
