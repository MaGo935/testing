<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>CS Web 1.6</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div id="hud">
      <div id="cross"></div>
      <div id="st"></div>
      <div id="sb"></div>
      <div id="kf"></div>
      <div
        id="code"
        style="
          position: absolute;
          top: 8px;
          left: 50%;
          transform: translateX(-50%);
          font-size: 14px;
          text-shadow: 1px 1px #000;
        "
      ></div>
    </div>
    <div id="menu">
      <h1>CS WEB 1.6</h1>
      <input id="nm" placeholder="Seu nome" maxlength="12" />
      <select id="tm">
        <option value="CT">Counter-Terrorist</option>
        <option value="T">Terrorist</option>
      </select>
      <button id="host">CRIAR PARTIDA (você é o host)</button>
      <input id="cd" placeholder="Código da partida" maxlength="4" />
      <button id="join">ENTRAR NA PARTIDA</button>
      <details>
        <summary>Servidor dedicado (opcional)</summary>
        <input id="srv" placeholder="wss://..." /><button id="ded">
          CONECTAR
        </button>
      </details>
      <small
        >WASD mover · Espaço pular · Mouse mirar/atirar · R recarregar</small
      >
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/scene.js"></script>
    <script src="js/player.js"></script>
    <script src="js/net.js"></script>
    <script src="js/host.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/input.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
